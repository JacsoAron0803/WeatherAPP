
<h3>Manage users</h3>
<hr>

<div class="table-responsive">
    <table class="table table-hover table-striped align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Email</th>
                <th>Registration</th>
                <th>Last Login</th>
                <th>Login Count</th>
                <th class="text-end">Status</th>
            </tr>
        </thead>

        <tbody id="userList">
            <tr>
                <td colspan="8" class="text-center">Loading users...</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="8" class="text-center">
                    <span id="usersCount">0</span> user(s)
                </td>
            </tr>
        </tfoot>
    </table>
</div>
