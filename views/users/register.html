<div class="col-lg-6 offset-lg-3">
<h3>Registration</h3>
<hr>

<div class="form-floating mb-3">
  <input type="text" class="form-control" id="name" >
  <label for="name">Username</label>
</div>
<div class="form-floating mb-3">
  <input type="email" class="form-control" id="email" >
  <label for="email">Email address</label>
</div>
<div class="form-floating mb-3">
  <input type="password" class="form-control" id="passwd" >
  <label for="passwd">Password</label>
</div>

<div class="form-floating mb-3">
  <input type="password" class="form-control" id="confirm" >
  <label for="confirm">Confirm Password</label>
</div>

<button type="button" class="btn btn-primary mb-3" onclick="registration()"><i class="bi bi-person-add"></i></i>&nbsp;Registration</button>

<p>Already registered?<strong> <a href="#" onclick="navigate('users/login')">Sign in here!</a></strong></p>
</div>
