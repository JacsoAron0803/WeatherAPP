<h3>Manage my steps</h3>
<hr>

<div class="accordion mb-3" id="accordionExample">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
        Manage steps
      </button>
    </h2>
    <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
      <div class="accordion-body">
        <div class="row ">

    <div class="col-5">
        <div class="form-floating mb-3 ">
            <input type="date" class="form-control" id="date" >
            <label for="date">Date</label>
        </div>  
    </div>

    <div class="col-5">
        <div class="form-floating mb-3 ">
            <input type="number" class="form-control" id="stepcount" >
            <label for="stepcount">Stepcount</label>
        </div>
    </div>

<button type="button" class="btn btn-primary mb-3 col-2" onclick="addSteps()"><i class="bi bi-plus-lg"></i></i>&nbsp;&nbsp;Add</button>

<ul class="nav nav-tabs" id="myTab" role="tablist">

  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="table-tab" data-bs-toggle="tab" data-bs-target="#table-tab-pane" type="button" role="tab" aria-controls="table-tab-pane" aria-selected="true">Table view</button>
  </li>

  <li class="nav-item" role="presentation">
    <button class="nav-link" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar-tab-pane" type="button" role="tab" aria-controls="calendar-tab-pane" aria-selected="false">Calendar view</button>
  </li>

  <li class="nav-item" role="presentation">
    <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart-tab-pane" type="button" role="tab" aria-controls="chart-tab-pane" aria-selected="false">Chart view</button>
  </li>
  
</ul>
<div class="tab-content" id="myTabContent" >
  <div class="tab-pane fade show active p-3" id="table-tab-pane" role="tabpanel" aria-labelledby="table-tab" tabindex="0">
    <table class="table table-striped table-hover">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Date</th>
      <th scope="col" class="text-end" >Stepcount</th>
      <th scope="col"class="text-end">Operation</th>
    </tr>
  </thead>
  <tbody id="stepsList">
    
    <tr class="tfoot">
        <td colspan="2"><strong>Summary:</strong> </td>
        <td class="text-end"><strong>16008</strong> </td>
        <td>
            <br>
        </td>
    </tr>
  </tbody>
</table>
  </div>
  <div class="tab-pane fade p-3" id="calendar-tab-pane" role="tabpanel" aria-labelledby="calendar-tab" tabindex="0">
    <h3>Calendar view</h3>

    <div id='calendar'></div>

  </div>
  <div class="tab-pane fade p-3" id="chart-tab-pane" role="tabpanel" aria-labelledby="chart-tab" tabindex="0">
    <h3>Chart view</h3>

      <canvas id="myChart"></canvas>

  </div>
  
</div>
